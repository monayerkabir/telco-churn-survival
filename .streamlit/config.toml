# Theme from the project's validated chart palette, with separate light and dark steps.

[theme]
font = "sans-serif"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[client]
toolbarMode = "viewer"  # no developer "Deploy" button for visitors

[browser]
gatherUsageStats = false
